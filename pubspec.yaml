name: timetable
description: "An offline-first planner for daily schedules, recurring routines, and focus tracking."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_slidable: ^4.0.3
  flutter_staggered_animations: ^1.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  home_widget: ^0.9.0
  intl: ^0.20.3
  provider: ^6.1.2
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: ic_launcher
  ios: true
  image_path: assets/icon/app_icon_v2.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/icon/app_icon_v2.png
    background_color: "#0B1020"
    theme_color: "#4F7CFF"
  windows:
    generate: true
    image_path: assets/icon/app_icon_v2.png
    icon_size: 48
